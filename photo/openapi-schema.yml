components:
  schemas:
    AuthMeResponse:
      type: object
      description: |-
        Schéma de la réponse de l'endpoint '/auth/me/'.
        Permet au frontend d'adapter dynamiquement la barre de navigation et les permissions
        selon le rôle retourné ('owner', 'manager', 'photographer' ou 'superuser').
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          description: Données de l'utilisateur connecté
        organization:
          allOf:
          - $ref: '#/components/schemas/OrganizationSummary'
          nullable: true
          description: Organisation à laquelle est rattaché l'utilisateur (None si
            superuser non affilié)
        role:
          type: string
          description: 'Rôle de l''utilisateur : ''owner'', ''manager'', ''photographer''
            ou ''superuser'''
      required:
      - organization
      - role
      - user
    CreateClientAccountRequest:
      type: object
      description: |-
        Validation du formulaire de création de compte client par l'administrateur plateforme (Option B).
        Génère l'organisation et pré-crée le compte utilisateur sans déclencher d'envoi d'email automatique,
        laissant l'administrateur copier le lien pour l'envoyer directement sur WhatsApp.
      properties:
        organizationName:
          type: string
          minLength: 1
          description: Nom commercial de l'organisation ou du studio
          maxLength: 200
        ownerEmail:
          type: string
          format: email
          minLength: 1
          description: Adresse email unique du futur propriétaire
        ownerFirstName:
          type: string
          minLength: 1
          default: ''
          description: Prénom du client
          maxLength: 150
        ownerLastName:
          type: string
          minLength: 1
          default: ''
          description: Nom de famille du client
          maxLength: 150
        ownerPhone:
          type: string
          minLength: 1
          default: ''
          description: Numéro WhatsApp du client (+226...)
          maxLength: 35
      required:
      - organizationName
      - ownerEmail
    CreateInvitationRequest:
      type: object
      description: |-
        Validation pour la génération d'un lien d'invitation à destination d'un nouveau collaborateur.
        Restreint les rôles attribuables par l'organisateur à 'manager' ou 'photographer'.
      properties:
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: manager
          description: |-
            Rôle assigné au collaborateur invité

            * `manager` - manager
            * `photographer` - photographer
        email:
          type: string
          format: email
          minLength: 1
          default: ''
          description: Email optionnel pour référence
        phone:
          type: string
          minLength: 1
          default: ''
          description: Numéro WhatsApp optionnel
          maxLength: 35
    CustomTokenObtainPair:
      type: object
      description: |-
        Sérialiseur de jeton JWT acceptant l'email comme identifiant de connexion.

        Pourquoi cette surcharge :
        Par défaut, SimpleJWT n'accepte que le champ 'username'. En rendant 'username'
        facultatif et en autorisant 'email', nous offrons une expérience de connexion moderne
        sans modifier le modèle utilisateur natif de Django.
      properties:
        email:
          type: string
          format: email
    CustomTokenObtainPairRequest:
      type: object
      description: |-
        Sérialiseur de jeton JWT acceptant l'email comme identifiant de connexion.

        Pourquoi cette surcharge :
        Par défaut, SimpleJWT n'accepte que le champ 'username'. En rendant 'username'
        facultatif et en autorisant 'email', nous offrons une expérience de connexion moderne
        sans modifier le modèle utilisateur natif de Django.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
      required:
      - password
    EventCreateRequest:
      type: object
      description: |-
        Validation pour la création d'un événement par un 'owner' ou 'manager' de l'organisation.
        Applique des valeurs par défaut sécurisées (statut 'traitement' pour masquer l'événement
        tant que les photos ne sont pas prêtes).
      properties:
        name:
          type: string
          minLength: 1
          description: Titre officiel de l'événement
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        tagline:
          type: string
          minLength: 1
          default: ''
          description: Slogan ou sous-titre d'accroche
          maxLength: 300
        description:
          type: string
          minLength: 1
          default: ''
          description: Présentation détaillée de la cérémonie ou du projet
        city:
          type: string
          minLength: 1
          description: 'Ville de l''événement (ex: Ouagadougou, Bobo-Dioulasso)'
          maxLength: 100
        venue:
          type: string
          default: ''
          description: Lieu précis (salle, hôtel, domaine)
          maxLength: 200
        date:
          type: string
          format: date
          description: Date de déroulement de l'événement
        status:
          allOf:
          - $ref: '#/components/schemas/EventStatusEnum'
          default: traitement
          description: |-
            Statut de publication

            * `en_ligne` - En ligne
            * `traitement` - Traitement
            * `archive` - Archive
        accent_color:
          type: string
          minLength: 1
          default: oklch(0.578 0.221 27.5)
          maxLength: 100
        accent_text_color:
          type: string
          minLength: 1
          default: oklch(0.99 0 0)
          maxLength: 100
        organizer_name:
          type: string
          minLength: 1
          default: ''
          maxLength: 200
        organizer_about:
          type: string
        organizer_website:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        organizer_phone:
          type: string
          nullable: true
          maxLength: 30
        highlights: {}
      required:
      - city
      - date
      - name
    EventDetail:
      type: object
      description: |-
        Sérialiseur détaillé pour la consultation d'un événement spécifique.
        Hérite de EventListSerializer en chargeant cette fois la galerie réelle de photos publiques.
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: Titre officiel de l'événement
          maxLength: 200
        tagline:
          type: string
          description: Slogan ou sous-titre d'accroche
          maxLength: 300
        description:
          type: string
          description: Présentation détaillée de la cérémonie ou du projet
        logoUrl:
          type: string
          format: uri
          readOnly: true
        city:
          type: string
          description: 'Ville de l''événement (ex: Ouagadougou, Bobo-Dioulasso)'
          maxLength: 100
        venue:
          type: string
          description: Lieu précis (salle, hôtel, domaine)
          maxLength: 200
        date:
          type: string
          format: date
          description: Date de déroulement de l'événement
        dateLabel:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/EventStatusEnum'
          description: |-
            Statut de publication

            * `en_ligne` - En ligne
            * `traitement` - Traitement
            * `archive` - Archive
        cover:
          type: string
          format: uri
          readOnly: true
        theme:
          type: object
          additionalProperties: {}
          description: Expose les variables CSS de couleurs pour l'habillage dynamique
            de la page événement.
          readOnly: true
        organizer:
          type: object
          additionalProperties: {}
          description: Structure les métadonnées de l'organisateur hôte de l'événement.
          readOnly: true
        highlights: {}
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PhotoItem'
          readOnly: true
        video:
          allOf:
          - $ref: '#/components/schemas/VideoItem'
          readOnly: true
        participants:
          type: integer
          description: Décompte des participants uniques ayant au moins une photo
            matchée.
          readOnly: true
        photosCount:
          type: integer
          description: Nombre total de photos publiées pour cet événement.
          readOnly: true
      required:
      - city
      - cover
      - date
      - dateLabel
      - description
      - logoUrl
      - name
      - organizer
      - participants
      - photos
      - photosCount
      - slug
      - tagline
      - theme
      - video
    EventList:
      type: object
      description: |-
        Sérialiseur optimisé pour l'affichage en liste (Catalogue public ou Dashboard admin).

        Optimisation clé :
        Ne charge pas la collection complète des photos (laisse le champ 'photos' vide) afin de ne pas
        télécharger des milliers d'objets en mémoire lors du listing. Les décomptes sont pré-calculés
        via les annotations ORM ('annotated_photos_count', 'annotated_participants_count') pour éliminer
        les requêtes SQL redondantes (problème N+1).
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: Titre officiel de l'événement
          maxLength: 200
        tagline:
          type: string
          description: Slogan ou sous-titre d'accroche
          maxLength: 300
        description:
          type: string
          description: Présentation détaillée de la cérémonie ou du projet
        logoUrl:
          type: string
          format: uri
          readOnly: true
        city:
          type: string
          description: 'Ville de l''événement (ex: Ouagadougou, Bobo-Dioulasso)'
          maxLength: 100
        venue:
          type: string
          description: Lieu précis (salle, hôtel, domaine)
          maxLength: 200
        date:
          type: string
          format: date
          description: Date de déroulement de l'événement
        dateLabel:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/EventStatusEnum'
          description: |-
            Statut de publication

            * `en_ligne` - En ligne
            * `traitement` - Traitement
            * `archive` - Archive
        cover:
          type: string
          format: uri
          readOnly: true
        theme:
          type: object
          additionalProperties: {}
          description: Expose les variables CSS de couleurs pour l'habillage dynamique
            de la page événement.
          readOnly: true
        organizer:
          type: object
          additionalProperties: {}
          description: Structure les métadonnées de l'organisateur hôte de l'événement.
          readOnly: true
        highlights: {}
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PhotoItem'
          readOnly: true
        video:
          allOf:
          - $ref: '#/components/schemas/VideoItem'
          readOnly: true
        participants:
          type: integer
          description: Décompte des participants uniques ayant au moins une photo
            matchée.
          readOnly: true
        photosCount:
          type: integer
          description: Nombre total de photos publiées pour cet événement.
          readOnly: true
      required:
      - city
      - cover
      - date
      - dateLabel
      - description
      - logoUrl
      - name
      - organizer
      - participants
      - photos
      - photosCount
      - slug
      - tagline
      - theme
      - video
    EventPatchStatusEnum:
      enum:
      - en_ligne
      - traitement
      - archive
      type: string
      description: |-
        * `en_ligne` - en_ligne
        * `traitement` - traitement
        * `archive` - archive
    EventStatusEnum:
      enum:
      - en_ligne
      - traitement
      - archive
      type: string
      description: |-
        * `en_ligne` - En ligne
        * `traitement` - Traitement
        * `archive` - Archive
    MultiFileUploadRequest:
      type: object
      description: |-
        Validation pour le téléversement simultané d'une série de photos (champ 'files').
        Permet aux photographes d'envoyer des lots complets de prise de vue en une seule requête HTTP.
      properties:
        files:
          type: array
          items:
            type: string
            format: binary
          description: Sélection de photos multiples à téléverser et soumettre au
            moteur IA
      required:
      - files
    MyPhotosResponse:
      type: object
      description: |-
        Schéma de la réponse retournée au participant lors de sa recherche faciale.
        - 'status' : État d'avancement ('no_reference', 'pending', 'ready')
        - 'photos' : Liste des fiches photos matchées avec URL et légende.
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/MyPhotosResponseStatusEnum'
          description: |-
            État du matching biométrique

            * `no_reference` - no_reference
            * `pending` - pending
            * `ready` - ready
        photos:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Collection des photos reconnues pour ce participant
      required:
      - photos
      - status
    MyPhotosResponseStatusEnum:
      enum:
      - no_reference
      - pending
      - ready
      type: string
      description: |-
        * `no_reference` - no_reference
        * `pending` - pending
        * `ready` - ready
    OrganizationSummary:
      type: object
      description: |-
        Sérialiseur concis présentant la fiche d'une organisation.
        Utilisé dans les réponses de profil pour identifier l'espace de travail actif du client.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Nom commercial de l'organisation ou de l'agence photo
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        website:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        phone:
          type: string
          maxLength: 35
        is_active:
          type: boolean
          description: Accès actif à la plateforme (désactivable par l'administrateur
            système)
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
    Participant:
      type: object
      description: Sérialiseur d'inscription et de consultation du profil d'un participant.
      properties:
        id:
          type: integer
          readOnly: true
        firstName:
          type: string
          description: Prénom de l'usager
        lastName:
          type: string
          description: Nom de famille de l'usager
        phone:
          type: string
          description: Numéro WhatsApp normalisé E.164
          maxLength: 30
        matchStatus:
          type: string
          readOnly: true
          description: Statut d'avancement du matching
      required:
      - firstName
      - id
      - lastName
      - matchStatus
      - phone
    ParticipantRequest:
      type: object
      description: Sérialiseur d'inscription et de consultation du profil d'un participant.
      properties:
        firstName:
          type: string
          minLength: 1
          description: Prénom de l'usager
        lastName:
          type: string
          minLength: 1
          description: Nom de famille de l'usager
        phone:
          type: string
          minLength: 1
          description: Numéro WhatsApp normalisé E.164
          maxLength: 30
      required:
      - firstName
      - lastName
      - phone
    PatchedEventPatchRequest:
      type: object
      description: |-
        Validation pour la mise à jour partielle (PATCH) d'un événement par son organisateur.
        Tous les champs sont optionnels : permet de modifier uniquement la date, le statut ou le nom.
      properties:
        name:
          type: string
          minLength: 1
          description: Nom de l'événement
        tagline:
          type: string
          minLength: 1
          description: Sous-titre d'accroche
        description:
          type: string
          minLength: 1
          description: Description de l'événement
        city:
          type: string
          minLength: 1
          description: Ville de l'événement
        venue:
          type: string
          minLength: 1
          description: Lieu de réception
        date:
          type: string
          format: date
          description: Date de l'événement (YYYY-MM-DD)
        status:
          $ref: '#/components/schemas/EventPatchStatusEnum'
        accent_color:
          type: string
          minLength: 1
          description: 'Couleur accent (ex: oklch(...))'
        accent_text_color:
          type: string
          minLength: 1
          description: Couleur texte accent
        organizer_name:
          type: string
          minLength: 1
        organizer_about:
          type: string
          minLength: 1
        organizer_website:
          type: string
          format: uri
          minLength: 1
        organizer_phone:
          type: string
          minLength: 1
        highlights:
          type: array
          items:
            type: string
            minLength: 1
    PhotoItem:
      type: object
      description: |-
        Sérialiseur d'une photo individuelle destinée à la galerie.
        Résout l'URL absolue complète en préfixant le protocole et le domaine (build_absolute_uri).
      properties:
        id:
          type: string
        src:
          type: string
          format: uri
          readOnly: true
        legend:
          type: string
          description: Légende ou description optionnelle
          maxLength: 200
        isPublic:
          type: boolean
      required:
      - id
      - isPublic
      - src
    RoleEnum:
      enum:
      - manager
      - photographer
      type: string
      description: |-
        * `manager` - manager
        * `photographer` - photographer
    SetPasswordFromTokenRequest:
      type: object
      description: |-
        Sérialiseur consommant le token d'invitation pour activer le compte et fixer le mot de passe.
        Impose une longueur minimale de 8 caractères pour garantir la sécurité des comptes.
      properties:
        token:
          type: string
          minLength: 1
          description: Jeton unique d'invitation reçu dans l'URL WhatsApp
        password:
          type: string
          writeOnly: true
          minLength: 8
          description: Nouveau mot de passe sécurisé (min. 8 car.)
        firstName:
          type: string
          minLength: 1
          default: ''
          description: Prénom à renseigner ou corriger
          maxLength: 150
        lastName:
          type: string
          minLength: 1
          default: ''
          description: Nom à renseigner ou corriger
          maxLength: 150
      required:
      - password
      - token
    SingleFileUploadRequest:
      type: object
      description: |-
        Validation pour le téléversement d'un fichier binaire unique (champ 'file').
        Utilisé notamment pour le logo de l'événement et les selfies de référence.
      properties:
        file:
          type: string
          format: binary
          description: Fichier image source (JPEG, PNG ou WEBP)
      required:
      - file
    TeamMember:
      type: object
      description: |-
        Représentation détaillée d'un collaborateur au sein d'une organisation.
        Aplatit la relation OrganizationMembership pour faciliter l'affichage dans un tableau React.
      properties:
        id:
          type: integer
          readOnly: true
        userId:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - createdAt
      - email
      - firstName
      - id
      - lastName
      - role
      - userId
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UserProfile:
      type: object
      description: |-
        Sérialiseur du profil utilisateur exposant les champs en camelCase
        afin de respecter les conventions de nommage des frameworks frontend (React / Angular / Vue).
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Adresse électronique
          maxLength: 254
        firstName:
          type: string
        lastName:
          type: string
        is_staff:
          type: boolean
          title: Statut équipe
          description: Précise si l’utilisateur peut se connecter à ce site d'administration.
        is_superuser:
          type: boolean
          title: Statut super-utilisateur
          description: Précise que l’utilisateur possède toutes les permissions sans
            les assigner explicitement.
      required:
      - firstName
      - id
      - lastName
      - username
    VideoItem:
      type: object
      description: Sérialiseur de la vidéo promotionnelle ou récapitulative de l'événement.
      properties:
        src:
          type: string
          format: uri
          readOnly: true
        title:
          type: string
          description: Titre de la vidéo
          maxLength: 200
        duration:
          type: string
          description: 'Durée lisible (ex: ''3:45'')'
          maxLength: 20
        sizeLabel:
          type: string
      required:
      - duration
      - sizeLabel
      - src
      - title
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Authentification
  description: Connexion et rafraîchissement des tokens JWT
- name: Événements
  description: Consultation publique des événements et galeries
- name: Participants
  description: Enregistrement, selfies de référence et RGPD
- name: Administration
  description: Statistiques, upload médias et gestion des organisateurs
