  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: 'Authentifie un administrateur à l''aide de son email (ex: admin@clovis-dev.bf)
        et retourne les tokens access & refresh.'
      summary: Connexion JWT (email ou username)
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      description: Retourne les informations de l'utilisateur, l'organisation à laquelle
        il appartient et son rôle ('owner', 'manager', 'photographer' ou 'superuser').
        Permet d'adapter l'interface et les menus frontend.
      summary: Profil de l'utilisateur connecté avec son organisation et rôle
      tags:
      - Authentification
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: api_v1_auth_refresh_create
      description: Génère un nouveau token d'accès à partir du token de rafraîchissement.
      summary: Rafraîchissement de token JWT
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/set-password/:
    get:
      operationId: api_v1_auth_set_password_retrieve
      description: Permet à la page frontend 'Définir mon mot de passe' de vérifier
        si le lien est valide, non expiré et de récupérer le nom de l'organisation
        et le profil invité avant la saisie.
      summary: Vérifier la validité d'un lien d'invitation (token)
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: Jeton unique d'invitation reçu dans l'URL
        required: true
      tags:
      - Authentification
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: api_v1_auth_set_password_create
      description: Active le compte et enregistre le mot de passe du client ou du
        collaborateur à partir du token d'invitation WhatsApp.
      summary: Définir son mot de passe et accepter l'invitation
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordFromTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPasswordFromTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPasswordFromTokenRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/events/:
    get:
      operationId: api_v1_events_list
      description: Retourne la liste des événements publics en ligne. Peut être filtré
        par organisation via `?org=<slug_organisation>` pour afficher la page dédiée
        d'un organisateur.
      summary: Lister les événements publics
      parameters:
      - in: query
        name: org
        schema:
          type: string
        description: 'Slug de l''organisation pour n''afficher que ses événements
          publics (ex: ''faso-business-club'')'
      tags:
      - Événements
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventList'
          description: ''
  /api/v1/events/{slug}/:
    get:
      operationId: api_v1_events_retrieve
      description: Récupère la fiche détaillée d'un événement avec sa galerie de photos
        et sa vidéo.
      summary: Détail d'un événement
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Événements
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
    patch:
      operationId: api_v1_events_partial_update
      description: Permet à l'organisateur / admin de modifier les informations d'un
        événement (date, nom, thème, statut).
      summary: Mise à jour partielle d'un événement
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventPatchRequest'
          multipart/form-data:
