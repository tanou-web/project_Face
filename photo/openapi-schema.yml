openapi: 3.0.3
info:
  title: Plateforme Photo Scan API
  version: 1.0.0
  description: |-
    Documentation interactive de l'API backend Django REST Framework pour la plateforme événementielle avec reconnaissance faciale (Burkina Faso).

    Fonctionnalités principales :
    - Gestion des événements et galeries médias
    - Upsert des participants via numéro WhatsApp
    - Ingestion sécurisée de selfie de référence & matching facial 512D
    - Endpoints RGPD de suppression et droit à l'oubli
    - Administration sécurisée via token JWT
paths:
  /admin/clients/create/:
    post:
      operationId: admin_clients_create_create
      description: L'administrateur plateforme crée l'organisation et le compte client.
        Retourne un lien unique valable 7 jours pour que le client définisse son mot
        de passe sans passer par un email.
      summary: Créer un compte client avec lien WhatsApp copiable (Option B)
      tags:
      - Plateforme Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateClientAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateClientAccountRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /admin/contacts/:
    get:
      operationId: admin_contacts_retrieve
      description: Récupère les coordonnées des participants et indique si leur référence
        faciale est valide.
      summary: Liste des contacts participants de l'organisation
      parameters:
      - in: query
        name: event
        schema:
          type: string
        description: Filtrer les participants par slug d'événement
      tags:
      - Administration
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /admin/events/:
    get:
      operationId: admin_events_list
      description: Ne renvoie que les événements appartenant à l'organisation de l'utilisateur
        connecté (aucun événement des autres clients n'apparaît).
      summary: Lister les événements de l'organisation
      tags:
      - Administration
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventList'
          description: ''
    post:
      operationId: admin_events_create
      description: Crée un nouvel événement et l'associe automatiquement à l'organisation
        connectée. Seuls les rôles 'owner' et 'manager' sont autorisés ('photographer'
        reçoit 403 Forbidden).
      summary: Créer un événement pour l'organisation
      tags:
      - Administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /admin/events/{slug}/logo/:
    post:
      operationId: admin_events_logo_create
      description: Upload d'un logo (champ `file`) et mise à jour de l'événement.
      summary: Upload de logo pour un événement
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Administration
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SingleFileUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SingleFileUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /admin/events/{slug}/media/:
    post:
      operationId: admin_events_media_create
      description: |-
        Téléversement d'une ou plusieurs photos pour un événement (champ `files`).
        Pour chaque fichier :
        1. Enregistre le média original.
        2. Crée la miniature Pillow (400x400 max) avec correction EXIF.
        3. Détecte tous les visages et génère les embeddings 512D (`FaceIndex`).
        4. Actualise automatiquement le matching pour les participants déjà inscrits.
      summary: Upload multiple de photos avec indexation faciale
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Administration
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MultiFileUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MultiFileUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /admin/media/{id}/:
    delete:
      operationId: admin_media_destroy
      description: Supprime la photo et tous ses index faciaux associés.
      summary: Suppression d'une photo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Administration
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /admin/stats/:
    get:
      operationId: admin_stats_retrieve
      description: Retourne le nombre total d'événements, photos, participants et
        téléchargements de l'organisation.
      summary: Statistiques globales de l'organisation
      tags:
      - Administration
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /admin/team/:
    get:
      operationId: admin_team_list
      description: |-
        Gestion des membres d'équipe au sein de l'organisation connectée.
        Permet au propriétaire et aux gestionnaires de consulter la liste des collaborateurs actuels.
      summary: Lister les collaborateurs de l'organisation
      tags:
      - Équipe SaaS
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
          description: ''
  /admin/team/{id}/:
    delete:
      operationId: admin_team_destroy
      description: Retire un membre de l'organisation. Seul un propriétaire ou gestionnaire
        peut effectuer cette action. Le propriétaire principal ne peut pas être retiré.
      summary: Retirer un collaborateur de l'équipe
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Équipe SaaS
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /admin/team/invite/:
    post:
      operationId: admin_team_invite_create
      description: Retourne un lien WhatsApp copiable avec le rôle spécifié ('manager'
        ou 'photographer'). Rôles vérifiés côté API (403).
      summary: Générer un lien d'invitation pour un collaborateur (valable 7 jours)
      tags:
      - Équipe SaaS
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/clients/create/:
    post:
      operationId: api_v1_admin_clients_create_create
      description: L'administrateur plateforme crée l'organisation et le compte client.
